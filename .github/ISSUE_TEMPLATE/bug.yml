name: Bug report
description: Report behavior that differs from the documentation.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you imported/configured, then what you clicked.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Quote the README section that promises the expected result, when possible.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: "1.0.0 / 4d48884"
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Edge
    validations:
      required: true
